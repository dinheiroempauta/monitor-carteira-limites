name: Monitoria de Desvio da Carteira

on:
  schedule:
    # O gatilho `schedule` do GitHub Actions não é garantido: em picos de
    # carga (ou incidentes gerais do serviço — já vimos um "Major Outage"
    # em Actions travar a rotina inteira num dia) os disparos podem
    # atrasar bastante ou ser descartados silenciosamente, sem ficar na
    # fila pra depois. Por isso a grade fina de 15min (6h-18h BRT) NÃO
    # mora aqui — é responsabilidade de um cron externo (cron-job.org)
    # chamando `workflow_dispatch`, que não depende do agendador do
    # GitHub. Esse `schedule` fica só como backup esparso (1x/hora,
    # minuto 44 — fora dos minutos "redondos" de maior carga). Janela
    # 9-21 UTC = 6h-18h BRT.
    - cron: "44 9-21 * * 1-5"
  workflow_dispatch:
    inputs:
      aporte:
        description: >-
          Valor do aporte em R$ (opcional). Se preenchido, calcula a
          distribuição entre os ativos e manda o resultado no Telegram —
          deixe em branco para uma execução normal do monitor de bandas.
        required: false
        type: string

permissions:
  contents: write
  # actions: write é usado só para acionar o workflow_dispatch da
  # Monitoria de Aportes quando ela estiver atrasada (ver
  # scripts/acionar_fluxo_irmao_se_atrasado.py) — nenhum outro uso.
  actions: write

# Depois de um incidente/degradação no GitHub Actions, vários disparos
# atrasados podem sair juntos quando o serviço normaliza — sem isso, duas
# execuções concorrentes disputariam o mesmo `git push` (last_status.yaml,
# history.csv). cancel-in-progress: false porque cada execução é relevante
# (não é um caso de "só a mais recente importa") — enfileira em vez de
# cancelar.
concurrency:
  group: monitor-desvio
  cancel-in-progress: false

jobs:
  desvio:
    runs-on: ubuntu-latest
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acionar monitoria de aportes se estiver atrasada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/acionar_fluxo_irmao_se_atrasado.py aportes monitor_aportes.yml

      - name: Decidir se este disparo do fallback é redundante
        id: decidir
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/decidir_execucao_redundante.py desvio

      - name: Instalar dependências
        if: steps.decidir.outputs.pular != 'true'
        run: pip install -r requirements.txt

      - name: Checar se o agendamento ficou tempo demais sem disparar
        if: steps.decidir.outputs.pular != 'true'
        env:
          PYTHONPATH: src
        run: python scripts/checar_heartbeat.py desvio

      - name: Rodar monitor e notificar
        if: steps.decidir.outputs.pular != 'true'
        env:
          PYTHONPATH: src
        run: python -m monitor.main

      - name: Calcular distribuição de aporte sob demanda (se preenchido no disparo manual)
        if: steps.decidir.outputs.pular != 'true' && github.event.inputs.aporte != ''
        env:
          PYTHONPATH: src
          APORTE_VALOR: ${{ github.event.inputs.aporte }}
        run: python scripts/calcular_aporte.py

      - name: Salvar status de banda e histórico (só quando mudou e gerou alerta)
        if: steps.decidir.outputs.pular != 'true'
        run: |
          # git status --porcelain (não git diff) porque history.csv pode
          # ser um arquivo novo/não rastreado da primeira vez.
          if [ -n "$(git status --porcelain -- config/last_status.yaml config/history.csv)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/last_status.yaml config/history.csv
            git commit -m "chore: atualiza last_status.yaml e history.csv após alerta"
            git push
          fi

      - name: Salvar timestamp da última execução (heartbeat)
        if: steps.decidir.outputs.pular != 'true'
        run: |
          if [ -n "$(git status --porcelain -- config/last_run_desvio_at.txt)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/last_run_desvio_at.txt
            git commit -m "chore: atualiza heartbeat da monitoria de desvio"
            git push
          fi
