name: Dashboard de Performance

on:
  schedule:
    # Backup esparso do `schedule` nativo do GitHub — não é garantido (ver
    # monitor_desvio.yml). O gatilho primário é um cron externo
    # (cron-job.org, `0 19 * * *`) chamando `workflow_dispatch` 1x/dia.
    # Minuto 58 (não :00) pelo mesmo motivo dos outros workflows (evitar
    # os minutos "redondos" de maior carga no `schedule` do GitHub) e bem
    # perto do horário do cron externo, pra servir de fallback de fato;
    # baixa criticidade — se os dois falharem num dia, pega o dia
    # seguinte.
    - cron: "58 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decidir se este disparo do fallback é redundante
        id: decidir
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/decidir_execucao_redundante.py dashboard

      - name: Instalar dependências
        if: steps.decidir.outputs.pular != 'true'
        run: pip install -r requirements.txt

      - name: Preencher wealth_history.csv desde a primeira transação (idempotente)
        if: steps.decidir.outputs.pular != 'true'
        env:
          PYTHONPATH: src
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python scripts/backfill_wealth_history.py

      - name: Gerar dashboard de performance
        if: steps.decidir.outputs.pular != 'true'
        env:
          PYTHONPATH: src
        run: python scripts/build_dashboard.py

      - name: Publicar dashboard (docs/index.html + wealth_history.csv) se mudou
        if: steps.decidir.outputs.pular != 'true'
        run: |
          # git status --porcelain (não git diff) porque wealth_history.csv
          # pode ser um arquivo novo/não rastreado da primeira vez.
          if [ -n "$(git status --porcelain -- docs/index.html config/wealth_history.csv)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html config/wealth_history.csv
            git commit -m "chore: atualiza dashboard de performance"
            git push
          fi

      - name: Salvar timestamp da última execução (heartbeat)
        if: steps.decidir.outputs.pular != 'true'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%S+00:00" > config/last_run_dashboard_at.txt
          if [ -n "$(git status --porcelain -- config/last_run_dashboard_at.txt)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/last_run_dashboard_at.txt
            git commit -m "chore: atualiza heartbeat do dashboard de performance"
            git push
          fi
