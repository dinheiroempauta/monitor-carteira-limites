name: Monitor de Carteira

on:
  schedule:
    # Monitor de bandas: a cada 30min, das 10h às 18h (horário de Brasília,
    # UTC-3 fixo — sem horário de verão), dias úteis. 13-21 em UTC.
    - cron: "*/30 13-21 * * 1-5"
    # Dashboard de performance: 1x/dia, às 18h BRT (21h UTC) — não precisa
    # da frequência do monitor de bandas, e o histórico de preços é uma
    # chamada mais pesada por ticker.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor e notificar
        env:
          PYTHONPATH: src
        run: python -m monitor.main

      - name: Salvar status de banda e histórico (só quando mudou e gerou alerta)
        run: |
          # git status --porcelain (não git diff) porque history.csv pode
          # ser um arquivo novo/não rastreado da primeira vez.
          if [ -n "$(git status --porcelain -- config/last_status.yaml config/history.csv)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/last_status.yaml config/history.csv
            git commit -m "chore: atualiza last_status.yaml e history.csv após alerta"
            git push
          fi

      - name: Gerar dashboard de performance (1x/dia)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 1-5'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build_dashboard.py

      - name: Publicar dashboard (docs/index.html) se mudou
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 1-5'
        run: |
          if [ -n "$(git status --porcelain -- docs/index.html)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html
            git commit -m "chore: atualiza dashboard de performance"
            git push
          fi
