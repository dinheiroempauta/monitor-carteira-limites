name: Monitor de Carteira

on:
  schedule:
    # Monitor de bandas: a cada 30min, das 10h às 18h (horário de Brasília,
    # UTC-3 fixo — sem horário de verão), dias úteis. 13-21 em UTC.
    - cron: "*/30 13-21 * * 1-5"
    # Dashboard de performance: 1x/dia, às 18h BRT (21h UTC) — não precisa
    # da frequência do monitor de bandas, e o histórico de preços é uma
    # chamada mais pesada por ticker.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Importar notas de negociação por e-mail (se configurado)
        id: importar_notas
        env:
          PYTHONPATH: src
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NOTA_PDF_SENHA: ${{ secrets.NOTA_PDF_SENHA }}
        continue-on-error: true
        run: python scripts/import_notas_email.py

      - name: Alertar no Telegram se a importação de notas falhou
        if: steps.importar_notas.outcome == 'failure'
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os
          from monitor.telegram import send_message
          send_message(
              '⚠️ Falha ao importar notas de negociação por e-mail (Gmail). '
              'Provável causa: token OAuth expirado/revogado. '
              'Veja o log do step \'Importar notas de negociação por e-mail\' no GitHub Actions e refaça o setup em specs/003-importacao-automatica-notas/setup-gmail-oauth.md se necessário.',
              os.environ['TELEGRAM_BOT_TOKEN'],
              os.environ['TELEGRAM_CHAT_ID'],
          )
          "

      - name: Salvar transações importadas (se houver)
        run: |
          if [ -n "$(git status --porcelain -- config/transactions.csv config/processed_notas.txt)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/transactions.csv config/processed_notas.txt
            git commit -m "chore: importa transações das notas de negociação por e-mail"
            git push
          fi

      - name: Rodar monitor e notificar
        env:
          PYTHONPATH: src
        run: python -m monitor.main

      - name: Salvar status de banda e histórico (só quando mudou e gerou alerta)
        run: |
          # git status --porcelain (não git diff) porque history.csv pode
          # ser um arquivo novo/não rastreado da primeira vez.
          if [ -n "$(git status --porcelain -- config/last_status.yaml config/history.csv)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/last_status.yaml config/history.csv
            git commit -m "chore: atualiza last_status.yaml e history.csv após alerta"
            git push
          fi

      - name: Gerar dashboard de performance (1x/dia)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 1-5'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build_dashboard.py

      - name: Publicar dashboard (docs/index.html + wealth_history.csv) se mudou
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 1-5'
        run: |
          # git status --porcelain (não git diff) porque wealth_history.csv
          # pode ser um arquivo novo/não rastreado da primeira vez.
          if [ -n "$(git status --porcelain -- docs/index.html config/wealth_history.csv)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html config/wealth_history.csv
            git commit -m "chore: atualiza dashboard de performance"
            git push
          fi
