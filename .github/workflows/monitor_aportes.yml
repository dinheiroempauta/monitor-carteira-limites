name: Monitoria de Aportes

on:
  schedule:
    # Backup esparso (1x/hora, minuto 14 — fora dos minutos "redondos" de
    # maior carga) do `schedule` nativo do GitHub, que não é garantido
    # (ver monitor_desvio.yml). A cadência normal (15min) é
    # responsabilidade de um cron externo (cron-job.org) chamando
    # `workflow_dispatch`. Janela 9-21 UTC = 6h-18h BRT.
    - cron: "14 9-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita duas execuções concorrentes disputando o mesmo `git push` de
# config/transactions.csv etc. — ver monitor_desvio.yml para mais contexto.
concurrency:
  group: monitor-aportes
  cancel-in-progress: false

jobs:
  aportes:
    runs-on: ubuntu-latest
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decidir se este disparo do fallback é redundante
        id: decidir
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/decidir_execucao_redundante.py aportes

      - name: Instalar dependências
        if: steps.decidir.outputs.pular != 'true'
        run: pip install -r requirements.txt

      - name: Checar se o agendamento ficou tempo demais sem disparar
        if: steps.decidir.outputs.pular != 'true'
        env:
          PYTHONPATH: src
        run: python scripts/checar_heartbeat.py aportes

      - name: Importar notas de negociação por e-mail (se configurado)
        id: importar_notas
        if: steps.decidir.outputs.pular != 'true'
        env:
          PYTHONPATH: src
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NOTA_PDF_SENHA: ${{ secrets.NOTA_PDF_SENHA }}
        continue-on-error: true
        run: python scripts/import_notas_email.py

      - name: Alertar no Telegram se a importação de notas falhou
        if: steps.decidir.outputs.pular != 'true' && steps.importar_notas.outcome == 'failure'
        env:
          PYTHONPATH: src
        run: |
          python -c "
          import os
          from monitor.telegram import send_message
          send_message(
              '⚠️ Falha ao importar notas de negociação por e-mail (Gmail). '
              'Provável causa: token OAuth expirado/revogado. '
              'Veja o log do step \'Importar notas de negociação por e-mail\' no GitHub Actions e refaça o setup em specs/003-importacao-automatica-notas/setup-gmail-oauth.md se necessário.',
              os.environ['TELEGRAM_BOT_TOKEN'],
              os.environ['TELEGRAM_CHAT_ID'],
          )
          "

      - name: Notificar posição após nota(s) importada(s)
        if: steps.decidir.outputs.pular != 'true' && steps.importar_notas.outputs.notas_importadas != ''
        env:
          PYTHONPATH: src
          NOTAS_IMPORTADAS_RESUMO: ${{ steps.importar_notas.outputs.notas_importadas }}
        run: python scripts/notificar_posicao_apos_nota.py

      - name: Salvar transações importadas (se houver)
        if: steps.decidir.outputs.pular != 'true'
        run: |
          if [ -n "$(git status --porcelain -- config/transactions.csv config/processed_notas.txt config/notas_com_problema.txt)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/transactions.csv config/processed_notas.txt config/notas_com_problema.txt
            git commit -m "chore: importa transações das notas de negociação por e-mail"
            git push
          fi

      - name: Salvar timestamp da última execução (heartbeat)
        if: steps.decidir.outputs.pular != 'true'
        run: |
          if [ -n "$(git status --porcelain -- config/last_run_aportes_at.txt)" ]; then
            git config user.name "monitor-carteira-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/last_run_aportes_at.txt
            git commit -m "chore: atualiza heartbeat da monitoria de aportes"
            git push
          fi
